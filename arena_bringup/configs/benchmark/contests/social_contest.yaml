contestants:
  # ---- SocialNav ----
  # agent_name phải trùng basename checkpoint trong src/arena-social-nav/ckpt
  - name: SocialNav-FiLM
    local_planner: dwb
    inter_planner: navigate_w_replanning_time
    agent_name: SocialNav_margin

  # ---- Baseline DWB thuần (không AI) ----
  - name: DWB-Baseline
    local_planner: dwb
    inter_planner: navigate_w_replanning_time
    agent_name: ""          

  # ---- Urban Navigation (UrbanNav FiLM) ----
  # agent_name phải bắt đầu bằng "UrbanNav" và trùng basename checkpoint
  - name: UrbanNav-FiLM
    local_planner: dwb
    inter_planner: navigate_w_replanning_time
    agent_name: UrbanNav_FiLM

  # ---- CityWalker ----
  # agent_name nên bắt đầu bằng "CityWalker"; phần sau prefix là basename checkpoint
  - name: CityWalker-v1
    local_planner: dwb
    inter_planner: navigate_w_replanning_time
    agent_name: CityWalker_last-v2
